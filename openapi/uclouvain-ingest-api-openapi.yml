openapi: 3.0.3
info:
  title: Dataverse Access Ingest API
  description: Open source research data repository software.
  version: '6.8'
servers:
- url: https://dataverse.uclouvain.be/api
  description: Open Data @ UCLouvain Dataverse instance (v6.8)
tags:
- name: Ingest
paths:
  /ingest/test/file:
    get:
      operationId: TestIngest_datafile
      parameters:
      - name: fileName
        in: query
        schema:
          type: string
      - name: fileType
        in: query
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
      tags:
      - Ingest
