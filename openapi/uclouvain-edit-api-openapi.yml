openapi: 3.0.3
info:
  title: Dataverse Access Edit API
  description: Open source research data repository software.
  version: '6.8'
servers:
- url: https://dataverse.uclouvain.be/api
  description: Open Data @ UCLouvain Dataverse instance (v6.8)
tags:
- name: Edit
paths:
  /edit/{fileId}:
    put:
      operationId: EditDDI_edit
      parameters:
      - name: fileId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/xml:
            schema:
              format: binary
              type: string
      responses:
        '200':
          description: OK
      tags:
      - Edit
