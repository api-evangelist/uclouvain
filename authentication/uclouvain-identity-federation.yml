specification: API Commons Authentication
specificationVersion: '0.1'
provider: UCLouvain
providerId: uclouvain
generated: '2026-08-30'
method: probed
source: https://idp.uclouvain.be/idp/shibboleth
operator: institution
description: >-
  UCLouvain operates its own SAML 2.0 / Shibboleth identity provider and publishes signed
  entity metadata at a stable, unauthenticated URL. This is the institution's most clearly
  institution-owned machine-readable surface: the software is Shibboleth, but the entity, the
  scope, the keys and the endpoints are UCLouvain's, registered by UCLouvain with the Belnet
  federation and exported to eduGAIN. Authentication to UCLouvain-gated services is federated
  through this IdP rather than through per-service API keys; there is no public key-issuing
  developer portal on any UCLouvain host.
federation:
  entityID: https://idp.uclouvain.be/idp/shibboleth
  metadataURL: https://idp.uclouvain.be/idp/shibboleth
  organizationName: Universite catholique de Louvain
  scope: uclouvain.be
  registrationAuthority: http://federation.belnet.be/
  registrationInstant: '2012-03-27T12:00:00Z'
  interfederation: eduGAIN
  sirtfi: true
  first_seen_edugain: '2017-04-13'
  roles:
  - IDPSSODescriptor
  - AttributeAuthorityDescriptor
  protocols:
  - urn:oasis:names:tc:SAML:2.0:protocol
  - urn:oasis:names:tc:SAML:1.1:protocol
  - urn:mace:shibboleth:1.0
  endpoints:
  - service: SingleSignOnService
    binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
    location: https://idp.uclouvain.be/idp/profile/SAML2/Redirect/SSO
  - service: SingleSignOnService
    binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-POST
    location: https://idp.uclouvain.be/idp/profile/SAML2/POST/SSO
  - service: SingleLogoutService
    binding: urn:oasis:names:tc:SAML:2.0:bindings:HTTP-Redirect
    location: https://idp.uclouvain.be/idp/profile/SAML2/Redirect/SLO
  - service: AttributeService
    binding: urn:oasis:names:tc:SAML:2.0:bindings:SOAP
    location: https://idp.uclouvain.be:8443/idp/profile/SAML2/SOAP/AttributeQuery
  - service: ArtifactResolutionService
    binding: urn:oasis:names:tc:SAML:2.0:bindings:SOAP
    location: https://idp.uclouvain.be:8443/idp/profile/SAML2/SOAP/ArtifactResolution
