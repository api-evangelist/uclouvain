    displayName: ICLE - International Corpus of Learner English (Centre for English Corpus Linguistics)
    sirtfi: false
findings:
- >-
  The IdP's mdui:UIInfo block is still carrying unedited Shibboleth boilerplate — DisplayName
  "A name for the IdP at sso.unc.edu", Description "Enter a description for the IdP at sso.unc.edu"
  and a logo URL under sso.unc.edu. Discovery services that read mdui will render UCLouvain with
  another university's placeholder text. Observed 2026-08-30 in the self-published metadata.
