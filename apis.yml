- aid: uclouvain:osis
  name: OSIS - Open Student Information System
  description: >-
    OSIS (Open Student Information System) is an open-source higher-education management platform originated
    and maintained by UCLouvain to manage students, teachers, courses, and programs. It is a Django application
    published on GitHub and includes REST API and SDK components; it is run by the institution rather
    than offered as a hosted public API.
  humanURL: https://github.com/uclouvain/osis
  tags:
