- aid: uclouvain:dial-oai
  name: DIAL UCLouvain OAI-PMH
  description: >-
    DIAL (Digital Access to Libraries) is UCLouvain's institutional repository for research publications.
    It exposes an OAI-PMH 2.0 endpoint ("DIAL UCLouvain Repository") for harvesting publication metadata
    into discovery systems and aggregators.
  humanURL: https://dial.uclouvain.be/
  baseURL: https://dial.uclouvain.be/oai
  tags:
