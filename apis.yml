  another run, but its apis.yml pointer has been removed so it is no longer credited.'
apis:
- aid: uclouvain:orthanc-api
  name: Orthanc API
  description: 'Orthanc is a free and open-source, vendor-neutral DICOM server and medical-imaging ecosystem.
    UCLouvain describes itself as "the innovation engine behind Orthanc": the project is led by its author
    Sebastien Jodogne inside the Health Informatics Lab at ICTEAM, and the INGI department hosts and maintains
    the server infrastructure at orthanc.uclouvain.be. The REST API contract is generated from the Orthanc
    source and covers 239 paths / 299 operations across patients, studies, series, instances, modalities,
    peers, jobs, plugins and storage. This is the one surface in this repository that is UCLouvain''s
    own engineering rather than a purchased platform''s, and the public demo server answers unauthenticated
    GET /system live.'
  humanURL: https://orthanc.uclouvain.be/
  baseURL: https://orthanc.uclouvain.be/demo/
