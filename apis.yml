- aid: uclouvain:identity-federation
  name: UCLouvain Shibboleth Identity Provider -- SAML 2.0 metadata
  description: 'UCLouvain runs its own Shibboleth identity provider and publishes signed SAML 2.0 entity
    metadata at a stable, unauthenticated URL. entityID https://idp.uclouvain.be/idp/shibboleth, shibmd:Scope
    uclouvain.be, OrganizationName "Universite catholique de Louvain", registered with the Belnet federation
    since 2012 and exported to eduGAIN (SIRTFI asserted). It carries an IDPSSODescriptor and an AttributeAuthorityDescriptor
    with HTTP-Redirect, HTTP-POST, POST-SimpleSign and SOAP bindings. Two further UCLouvain SAML service
    providers are in eduGAIN: ipb.uclouvain.be and the CECL ICLE corpus SP. This is the institution''s
    most unambiguously institution-owned machine-readable surface, and it is the authentication layer
    for everything gated behind UCLouvain affiliation -- there is no API-key portal.'
  humanURL: https://idp.uclouvain.be/idp/shibboleth
  baseURL: https://idp.uclouvain.be/idp/shibboleth
  x-operator: institution
  x-operator-evidence: entityID and metadata host are under uclouvain.be; OrganizationName "Universite
    catholique de Louvain"; registrationAuthority http://federation.belnet.be/ with UCLouvain as the registered
