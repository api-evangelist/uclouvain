aid: uclouvain
name: UCLouvain
description: 'UCLouvain (Universite catholique de Louvain) is Belgium''s largest French-speaking university
  -- a private institution subsidised by public authorities, Catholic in identity, based in Louvain-la-Neuve
  with campuses in Brussels, Mons, Tournai, Charleroi and Namur, and ranked #203 in the QS World University
  Rankings 2025. Its programmable footprint is small, real, and mostly NOT its own engineering. UCLouvain
  operates no public developer portal, issues no API keys, and api.uclouvain.be answers 503 with no backend
  behind it. What it does operate, verified live on 2026-08-30: the Orthanc medical-imaging ecosystem
  -- a genuinely UCLouvain-authored open-source project run out of ICTEAM''s Health Informatics Lab, publishing
  a 239-path OpenAPI 3.0 contract and a public demo server; four OAI-PMH 2.0 repositories (Dataverse open
  data, DIAL.pr research publications, DIAL.mem master''s theses, OER-UCLouvain open educational resources);
  a SAML 2.0 / Shibboleth identity provider registered with the Belnet federation and exported to eduGAIN;
  and Crossref membership in its own right, minting DOIs under prefix 10.14428. Everything else that looks
  like a UCLouvain API is a product''s contract running on a UCLouvain host: the Dataverse 6.8 Native
  API and the DSpace-CRIS 8.1 REST API behind DIAL are recorded here as tenant deployments, not as UCLouvain''s
  contracts. An earlier profile of this repository credited UCLouvain with 36 OpenAPI definitions that
  were in fact one Dataverse product spec split by tag -- a contract eight institutions in this catalog
  ship identically. Those have been removed.'
